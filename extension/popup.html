<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickCopy</title>
  <style>
    :root{--lime:#c6ff00;--ink:#10110e;--surface:#111210;--panel:#191c17;--field:#0d0e0d;--text:#f4f0e7;--muted:#858a7d;--line:#30352c;--subtle:#26321d}*{box-sizing:border-box}html,body{margin:0;width:350px;height:640px;overflow:hidden}body{background:var(--surface);color:var(--text);font:12px Arial,sans-serif;transition:background .18s ease,color .18s ease}body[data-theme="light"]{--lime:#86a900;--ink:#f4f7f0;--surface:#f3f5ef;--panel:#e8ece3;--field:#fff;--text:#19201a;--muted:#627066;--line:#c8d0c4;--subtle:#dce5d2}.head{height:64px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{display:flex;align-items:center;gap:9px}.mark{width:40px;height:40px;display:grid;place-items:center;overflow:hidden;border-radius:9px}.mark img{width:100%;height:100%;object-fit:cover}.title{font-weight:bold;font-size:16px}.sub{display:block;color:var(--muted);font-size:8px;letter-spacing:1px;margin-top:3px}.head-right{display:flex;align-items:center;gap:8px}.theme-toggle{width:28px;height:28px;padding:0;display:grid;place-items:center;border:1px solid var(--line);background:var(--field);color:var(--text);cursor:pointer;font-size:14px}.theme-toggle:hover{border-color:var(--lime);color:var(--lime)}.status{color:var(--lime);font-size:9px;letter-spacing:1px}.body{position:relative;height:576px;padding:12px;overflow:hidden}.eyebrow{color:var(--lime);font-size:9px;letter-spacing:1px}.wallet-scroll{max-height:218px;overflow-y:auto;scrollbar-width:none}.wallet-scroll::-webkit-scrollbar{display:none}.row{display:flex;align-items:center;gap:7px;padding:7px 8px;margin-top:6px;min-height:43px;background:var(--panel);border:1px solid var(--line);transition:background .16s,border-color .16s,transform .16s}.row.active{border-color:var(--lime)}.row.drag-over{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 10%,var(--panel));transform:translateY(-2px)}.drag{width:14px;padding:0;border:0;background:transparent;color:var(--muted);cursor:grab;font-size:13px;line-height:1}.drag:hover{color:var(--lime)}.symbol{flex:0 0 24px;width:24px;height:24px;border-radius:50%;background:var(--subtle);display:grid;place-items:center;color:var(--lime)}.symbol svg{width:14px;height:14px}.info{flex:1;min-width:0}.name{font-weight:bold;font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:block;color:var(--muted);font-size:8px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy{background:var(--lime);color:var(--ink);border:0;padding:7px 8px;font-size:8px;font-weight:bold;cursor:pointer;transition:transform .16s cubic-bezier(.23,1,.32,1),box-shadow .16s,background .16s}.copy:hover{transform:translateY(-1px) scale(1.06);box-shadow:0 5px 12px color-mix(in srgb,var(--lime) 27%,transparent)}.copy.copied{animation:copy-pop .38s cubic-bezier(.23,1,.32,1)}.edit,.delete{width:18px;padding:0;color:var(--muted);background:transparent;border:0;cursor:pointer;font-size:16px;line-height:1}.edit:hover{color:var(--lime)}.delete:hover{color:#e77867}.add{width:100%;margin-top:8px;padding:8px;border:1px dashed color-mix(in srgb,var(--line) 70%,var(--lime));background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.add:hover{color:var(--lime);border-color:var(--lime)}.form{display:none}.form.open{position:absolute;inset:0;z-index:5;display:block;padding:18px 12px;background:var(--surface);border-top:1px solid var(--line)}.form:before{content:"EDIT WALLET";display:block;margin-bottom:14px;color:var(--lime);font-size:9px;letter-spacing:1px}.field{margin:0 0 8px;display:block;color:var(--muted);font-size:9px}.field input,.field select{display:block;width:100%;margin-top:5px;background:var(--field);border:1px solid var(--line);color:var(--text);padding:8px;outline:0;font-size:10px}.field input:focus,.field select:focus{border-color:var(--lime)}.save{width:100%;border:0;background:var(--lime);color:var(--ink);font-weight:bold;padding:9px;cursor:pointer}.quick-settings{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.quick-settings .field{margin-top:8px;margin-bottom:0}.shape-row,.size-row{display:flex;gap:7px;margin-top:5px}.shape,.size{width:36px;height:25px;border:1px solid var(--line);background:var(--field);color:var(--text);display:grid;place-items:center;cursor:pointer}.shape.active,.size.active{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}.shape-circle{border-radius:50%}.shape-rounded{border-radius:7px}.size-glyph{display:block;background:currentColor}.size-medium .size-glyph{width:9px;height:7px}.size-large .size-glyph{width:21px;height:16px}.color-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px}.color{height:25px;border:1px solid var(--line);background:var(--field);color:var(--muted);font-size:7px;cursor:pointer}.color.active{border-color:var(--lime);color:var(--lime)}.color-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}.check{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:9px}.check input{accent-color:var(--lime)}.note{font-size:8px;color:var(--muted);line-height:1.4;margin:10px 0 0}.byline{display:block;margin:7px 0 0;color:var(--muted);font-size:8px;text-decoration:none}.byline:hover{color:var(--lime)}@keyframes copy-pop{50%{transform:scale(1.11)}}
  </style>
</head>
<body data-theme="dark">
  <header class="head"><div class="logo"><div class="mark"><img src="icon.png" alt="QuickCopy"></div><div><span class="title">quickcopy</span><span class="sub">WALLET CONTROL</span></div></div><div class="head-right"><button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle theme">☼</button><span class="status">● READY</span></div></header>
  <main class="body"><div class="eyebrow">YOUR ADDRESSES · MAX 10</div><div class="wallet-scroll"><div id="wallets"></div></div><button class="add" id="add">+ Add wallet</button><form class="form" id="form"><label class="field">Wallet name<input id="name" required placeholder="Main Ethereum"></label><label class="field">Network<select id="network"><option value="Ethereum">Ethereum</option><option value="Solana">Solana</option></select></label><label class="field">Public address<input id="address" required placeholder="0x... or wallet address"></label><button class="save" id="saveWallet">Save wallet</button></form><section class="quick-settings"><div class="eyebrow">BUTTON STYLE</div><label class="field">Shape<div class="shape-row"><button type="button" class="shape shape-circle" data-shape="circle" aria-label="Circle"></button><button type="button" class="shape shape-rounded" data-shape="rounded" aria-label="Rounded"></button></div></label><label class="field">Size<div class="size-row"><button type="button" class="size size-medium" data-size="medium" aria-label="Medium"><span class="size-glyph"></span></button><button type="button" class="size size-large" data-size="large" aria-label="Large"><span class="size-glyph"></span></button></div></label><label class="field">Accent color<div class="color-row"><button type="button" class="color" data-color="lime"><span class="color-dot" style="background:#d7ff4f"></span>Lime</button><button type="button" class="color" data-color="sky"><span class="color-dot" style="background:#85d8ff"></span>Sky</button><button type="button" class="color" data-color="coral"><span class="color-dot" style="background:#ff9c72"></span>Coral</button><button type="button" class="color" data-color="violet"><span class="color-dot" style="background:#c2a5ff"></span>Violet</button></div></label><label class="check"><input id="label" type="checkbox" checked> Show “Copy wallet” label</label></section><p class="note">Only store public addresses. Never add a seed phrase or private key.</p><a class="byline" href="https://x.com/amiraphist" target="_blank" rel="noreferrer">A project by @amiraphist</a></main>
  <script src="popup.js"></script>
</body>
</html>
